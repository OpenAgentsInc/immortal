[env]
# Apple clang does not ship a wasm backend. Keep the existing secp256k1 C
# implementation and route only its wasm build through the already-required
# Zig toolchain wrapper. This is manual/local build tooling, not CI automation.
CC_wasm32_unknown_unknown = { value = "scripts/wasm-cc", relative = true }
AR_wasm32_unknown_unknown = { value = "scripts/wasm-ar", relative = true }
