[package]
name = "immortal"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
description = "A hardened Nostr relay. One Rust binary, one Postgres. Nothing else."
repository = "https://github.com/OpenAgentsInc/immortal"

# Dependency policy: additions require owner sign-off recorded in AGENTS.md.
# Allowlist: tokio, tokio-tungstenite, tokio-postgres, secp256k1, sha2,
# serde, serde_json. Dependencies land with the packet that uses them.
[dependencies]
secp256k1 = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
