[package]
name = "immortal"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
description = "A hardened Nostr relay. One Rust binary, one Postgres. Nothing else."
repository = "https://github.com/OpenAgentsInc/immortal"

[[bin]]
name = "immortal"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dep:tokio", "dep:tokio-postgres", "dep:tokio-tungstenite"]

# Dependency policy: additions require owner sign-off recorded in AGENTS.md.
# Allowlist: tokio, tokio-tungstenite, tokio-postgres, secp256k1, sha2,
# serde, serde_json. Dependencies land with the packet that uses them.
[dependencies]
secp256k1 = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }
