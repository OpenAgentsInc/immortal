[workspace]
members = [
    "crates/immortal-core",
    "crates/immortal-client",
    "crates/immortal-relay",
    "crates/immortal-provider",
    "crates/immortal-lab",
]
default-members = ["crates/immortal-relay"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
repository = "https://github.com/OpenAgentsInc/immortal"

# Dependency versions are pinned once for the per-crate owner-approved allowlists.
[workspace.dependencies]
secp256k1 = { version = "0.31.1", features = ["recovery"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

immortal-core = { path = "crates/immortal-core", default-features = false }
immortal-client = { path = "crates/immortal-client" }
