services:
  bitcoin:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.bitcoin
    command: ["-conf=/run/immortal-private/bitcoin.conf", "-datadir=/var/lib/bitcoin"]
    restart: "no"
    volumes:
      - bitcoin-data:/var/lib/bitcoin
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/bitcoin.conf
        target: /run/immortal-private/bitcoin.conf
        read_only: true
    networks:
      - smoke

  relay-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: immortal_relay
      POSTGRES_USER: immortal_relay
      POSTGRES_PASSWORD_FILE: /run/immortal-private/relay-postgres-password
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/relay-postgres-password
        target: /run/immortal-private/relay-postgres-password
        read_only: true
    networks:
      - smoke

  provider-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: immortal_provider
      POSTGRES_USER: immortal_provider
      POSTGRES_PASSWORD_FILE: /run/immortal-private/provider-postgres-password
    volumes:
      - provider-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/provider-postgres-password
        target: /run/immortal-private/provider-postgres-password
        read_only: true
    networks:
      - smoke

  relay:
    build:
      context: ../../..
      dockerfile: Dockerfile
    env_file:
      - ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/relay.env
    depends_on:
      - bitcoin
      - relay-postgres
    restart: "no"
    network_mode: service:bitcoin

  cln-provider:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.cln-hold
    command: ["--conf=/run/immortal-private/cln-provider.conf"]
    environment:
      LIGHTNINGD_NETWORK: regtest
    depends_on:
      - bitcoin
    restart: "no"
    volumes:
      - cln-provider-data:/root/.lightning
      - cln-provider-rpc:/rail-rpc
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/cln-provider.conf
        target: /run/immortal-private/cln-provider.conf
        read_only: true
    networks:
      - smoke

  cln-peer:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.cln-hold
    command: ["--conf=/run/immortal-private/cln-peer.conf"]
    environment:
      LIGHTNINGD_NETWORK: regtest
    depends_on:
      - bitcoin
    restart: "no"
    volumes:
      - cln-peer-data:/root/.lightning
      - cln-peer-rpc:/rail-rpc
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/cln-peer.conf
        target: /run/immortal-private/cln-peer.conf
        read_only: true
    networks:
      - smoke

  lnd-provider:
    image: lightninglabs/lnd:v0.20.1-beta@sha256:f0a2bdc4b8bc89cb3b31b6e12d6b16ac5145defd916d8152cf0c1c07d8697cff
    command: ["--configfile=/run/immortal-private/lnd-provider.conf"]
    depends_on:
      - bitcoin
    network_mode: service:bitcoin
    restart: "no"
    volumes:
      - lnd-provider-data:/root/.lnd
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/lnd-provider.conf
        target: /run/immortal-private/lnd-provider.conf
        read_only: true

  alert-sink:
    build:
      context: .
      dockerfile: Dockerfile.support
    environment:
      IMMORTAL_PROVIDER_SMOKE_ALERT_FILE: /evidence/provider-alert.json
    network_mode: service:bitcoin
    depends_on:
      - bitcoin
    restart: "no"
    volumes:
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/evidence
        target: /evidence

  provider:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.provider
      target: provider
    command: ["run"]
    env_file:
      - ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/provider.env
    network_mode: service:bitcoin
    depends_on:
      - bitcoin
      - cln-provider
      - provider-postgres
      - relay
      - alert-sink
    restart: "no"
    volumes:
      - type: volume
        source: cln-provider-rpc
        target: /rail/cln-provider
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/provider-wallet-seed
        target: /run/immortal-private/provider-wallet-seed
        read_only: true

  provider-lnd:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.provider
      target: provider-lnd
    command: ["run"]
    env_file:
      - ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/provider-lnd.env
    network_mode: service:bitcoin
    depends_on:
      - bitcoin
      - lnd-provider
      - provider-postgres
      - relay
      - alert-sink
    restart: "no"
    volumes:
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/provider-wallet-seed
        target: /run/immortal-private/provider-wallet-seed
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/lnd-credentials/tls.cert
        target: /run/immortal-lnd/tls.cert
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/lnd-credentials/readonly.macaroon
        target: /run/immortal-lnd/readonly.macaroon
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/lnd-credentials/invoice.macaroon
        target: /run/immortal-lnd/invoice.macaroon
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/lnd-credentials/router.macaroon
        target: /run/immortal-lnd/router.macaroon
        read_only: true

  driver:
    build:
      context: ../../..
      dockerfile: scripts/support/provider-funded/Dockerfile.provider
      target: driver
    env_file:
      - ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/driver.env
    network_mode: service:bitcoin
    depends_on:
      - provider
    restart: "no"
    volumes:
      - type: volume
        source: cln-peer-rpc
        target: /rail/cln-peer
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/client-wallet-seed
        target: /run/immortal-private/client-wallet-seed
        read_only: true
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/evidence
        target: /evidence
      - type: bind
        source: ${IMMORTAL_PROVIDER_SMOKE_PRIVATE_DIR:?private directory is required}/state
        target: /state

networks:
  smoke:

volumes:
  bitcoin-data:
  cln-peer-data:
  cln-peer-rpc:
  cln-provider-data:
  cln-provider-rpc:
  lnd-provider-data:
  provider-postgres-data:
  relay-postgres-data:
