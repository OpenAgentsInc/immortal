name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m1-through-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with lint and format components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Deny compiler and Clippy warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run pinned fixture and static suites
        run: cargo test --locked --all-targets

      - name: Put PostgreSQL tools on PATH
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Run disposable-Postgres, process-chaos, and load proofs
        run: ./scripts/test-postgres.sh
