[package]
name = "immortal-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dev-only adversarial-lab wallet harness (immortal#32). Never deployed."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "immortal-lab"
path = "src/main.rs"

# Owner-approved allowlist: the workspace's seven external crates. The funded
# harness reuses the in-repo provider rail/wallet implementation; products do
# not depend on this dev-only crate.
[dependencies]
immortal-client.workspace = true
immortal-core.workspace = true
immortal-provider = { path = "../immortal-provider" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
